# A decision, not a suppression.
#
# This file carries the same two things `sablier accept` demands of anybody
# using this tool: a statement somebody wrote, and a date it stops being true.
# An entry without both is the thing this project exists to refuse, and an
# entry that outlives its expiry turns the gate red again rather than quietly
# keeping it green.
#
# One limitation, stated because it matters: Trivy applies an ignored id to
# every image scanned, not to the one named below. So an entry here has to be
# justified for all three, and narrow enough in time that the question comes
# back quickly.
vulnerabilities:
  - id: CVE-2026-111497
    statement: >-
      brotli-libs 1.2.0-r1 ships in phpstan:2-php8.5 (sha256:61bce0b7…), the
      latest, on both architectures. Alpine publishes the fix as 1.2.1-r0;
      php:8.5-cli-alpine and trivy:0.76.2 have been rebuilt with it, PHPStan's
      image has not (checked 2026-11-09), and we do not control that rebuild.
      The flaw is an out-of-bounds write in the decoder, on crafted compressed
      input. PHPStan reads this repository's own sources and decodes no
      brotli. Re-checked every Monday by the scheduled run; the entry goes as
      soon as the image ships 1.2.1. Still true on 2026-11-09: renewed for one
      week.
    expired_at: 2026-11-16
  - id: CVE-2026-92392
    statement: >-
      curl and libcurl 8.22.0-r0 ship in phpstan:2-php8.5 (sha256:61bce0b7…),
      the latest, on both architectures. Alpine publishes the fix as
      8.23.0-r0; the other two images have it, PHPStan's has not been rebuilt
      (checked 2026-11-09), and we do not control that rebuild. The flaw is a
      use-after-free during an HTTP/2 upload. PHPStan makes no request, with
      curl or otherwise. Re-checked every Monday by the scheduled run; the
      entry goes as soon as the image ships 8.23.0. Still true on 2026-11-09:
      renewed for one week.
    expired_at: 2026-11-16

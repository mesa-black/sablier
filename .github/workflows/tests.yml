name: tests

on:
  push:
    branches: [main]
    # A tag runs the same three jobs, and then publishes. Eight tags existed and
    # four of them had a release: a tag is a git object, a release is a GitHub
    # one, and the second had been made by hand until it was forgotten.
    tags: ['v*']
  pull_request:
  # A container with no known vulnerability today is not a container with no
  # known vulnerability in March. The claim is re-made every week.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, openssl, json
          coverage: none

      # No dependencies to install: that is the point of the project, and it is
      # worth asserting rather than assuming.
      - name: No vendor directory is required
        run: test ! -d vendor

      - name: Lint every PHP file
        run: find bin src tests translations -type f \( -name '*.php' -o -name 'sablier' \) -print0 | xargs -0 -n1 php -l

      - name: Test suite
        run: ./tests/run.sh

      # The tool has to be able to read its own repository without crying wolf,
      # and it is the first user of its own pipeline mode: the reference is
      # committed, so a new finding, a verdict that got worse or a red finding
      # nobody decided on stops this build exactly as it would stop yours.
      # Refreshing .sablier/baseline.json is then a deliberate commit.
      - name: Scan its own repository
        run: ./bin/sablier scan . --no-probe --baseline=.sablier/baseline.json --out=self.html --lang=en

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Level max, in a container: this project has no vendor directory and a
      # QA tool is not a reason to start one.
      - name: PHPStan
        run: make phpstan

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tool tells people to run three images — PHP for the machines
      # without it, PHPStan, and the scanner itself. Telling them that while
      # shipping known holes would be the exact failure this project is about.
      - name: No known high or critical CVE in the images we ask you to run
        run: make cve

  # A tag becomes a release, and only after the other three jobs have passed:
  # publishing a version whose own tests are red would be this project failing at
  # the one thing it sells.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, static-analysis, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — the release notes are the annotated tag's own message,
      # which lives in the tag object and not in the files.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `make release` reads the version from the source to name the archive,
      # and the step below reads it to compare with the tag.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # A release whose tool announces a different version than the tag it is
      # cut from is the first thing this project tells people not to ship.
      - name: The constant agrees with the tag
        run: |
          declared=$(php -r 'require "src/Version.php"; echo Sablier\Version::NUMBER;')
          test "v$declared" = "$GITHUB_REF_NAME" \
            || { echo "✗ tag $GITHUB_REF_NAME, Version::NUMBER $declared"; exit 1; }

      - name: Publish the release from the tag's own message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Re-pushing a tag is not a reason to fail a build, and a release that
          # already exists is left exactly as it is rather than overwritten.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "  release $tag already exists, nothing to do"
            exit 0
          fi
          git tag -l --format='%(contents:subject)' "$tag" > title.txt
          git tag -l --format='%(contents:body)' "$tag" > notes.md
          test -s title.txt || { echo "✗ $tag carries no message: annotate it with -a"; exit 1; }

          # The archive, and its digest in the notes. docs/airgap.md tells a
          # closed site that every release carries one and that rebuilding it
          # from the tag gives the same bytes — so it has to be here, and the
          # digest has to be readable without downloading anything. GitHub's own
          # "Source code (tar.gz)" is not this file: its bytes have changed
          # under everybody before, when their compression changed.
          make release > archive.txt
          archive=$(awk 'NR==1{print $1}' archive.txt)
          digest=$(awk '/sha256/{print $2}' archive.txt)
          test -s "$archive" || { echo "✗ make release produced no archive"; exit 1; }
          printf '\n---\n\nReproducible archive — rebuild it from the tag with `make release`, or:\n\n```\ngit archive --format=tar --prefix=%s/ %s | gzip -n -9 > %s\nopenssl dgst -sha256 %s\n```\n\n    %s  %s\n' \
            "${archive%.tar.gz}" "$tag" "$archive" "$archive" "$digest" "$archive" >> notes.md

          gh release create "$tag" --verify-tag \
            --title "$(cat title.txt)" --notes-file notes.md "$archive"
          echo "  published $tag — $(cat title.txt)"
          echo "  $archive  sha256 $digest"

name: tests

on:
  push:
    branches: [main]
  pull_request:
  # A container with no known vulnerability today is not a container with no
  # known vulnerability in March. The claim is re-made every week.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, openssl, json
          coverage: none

      # No dependencies to install: that is the point of the project, and it is
      # worth asserting rather than assuming.
      - name: No vendor directory is required
        run: test ! -d vendor

      - name: Lint every PHP file
        run: find bin src tests translations -type f \( -name '*.php' -o -name 'sablier' \) -print0 | xargs -0 -n1 php -l

      - name: Test suite
        run: ./tests/run.sh

      # The tool has to be able to read its own repository without crying wolf,
      # and it is the first user of its own pipeline mode: the reference is
      # committed, so a new finding, a verdict that got worse or a red finding
      # nobody decided on stops this build exactly as it would stop yours.
      # Refreshing .sablier/baseline.json is then a deliberate commit.
      - name: Scan its own repository
        run: ./bin/sablier scan . --no-probe --baseline=.sablier/baseline.json --out=self.html --lang=en

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Level max, in a container: this project has no vendor directory and a
      # QA tool is not a reason to start one.
      - name: PHPStan
        run: make phpstan

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tool tells people to run three images — PHP for the machines
      # without it, PHPStan, and the scanner itself. Telling them that while
      # shipping known holes would be the exact failure this project is about.
      - name: No known high or critical CVE in the images we ask you to run
        run: make cve
